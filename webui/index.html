<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>AutoDL deploy console</title>
<style>
  :root {
    --bg: #0b0e12;
    --panel: #12171e;
    --panel-2: #161d26;
    --line: #232c38;
    --text: #e6edf3;
    --muted: #8b98a8;
    --accent: #3fd07a;
    --warn: #e3b341;
    --bad: #f0616d;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: rgba(11,14,18,.88); backdrop-filter: blur(8px); z-index: 5;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font: 12px var(--mono); }
  main { padding: 24px; max-width: 1240px; margin: 0 auto; display: grid; gap: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card > h2 {
    margin: 0; padding: 12px 16px; font-size: 12px; font-weight: 600;
    letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  }
  .card-body { padding: 16px; }
  .banner {
    display: none; padding: 10px 14px; border-radius: 10px; font-size: 13px;
    background: rgba(240,97,109,.1); border: 1px solid rgba(240,97,109,.35); color: #ffc7cb;
  }
  .banner.show { display: block; }
  .banner code { font-family: var(--mono); }
  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 14px; }
  label { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
  input, select, button { font: inherit; color: var(--text); }
  input, select {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: #6b9de0; }
  input.mono { font-family: var(--mono); font-size: 12px; }
  button {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 13px; cursor: pointer; transition: border-color .12s, background .12s;
  }
  button:hover:not(:disabled) { border-color: #3c4b5e; background: #1b2431; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #05230f; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #4fe08a; border-color: #4fe08a; }
  button.danger { color: #ffb5bb; border-color: rgba(240,97,109,.45); }
  button.danger:hover:not(:disabled) { background: rgba(240,97,109,.12); }
  button.ghost { background: transparent; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .checks { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 8px 0; }
  .checks label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--text); }
  .checks input { width: auto; margin: 0; }
  .actions { display: flex; align-items: end; gap: 10px; grid-column: 1 / -1; }
  .status-line { font: 12px var(--mono); color: var(--muted); }
  details { grid-column: 1 / -1; border-top: 1px dashed var(--line); padding-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
  .img-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px 14px; margin-top: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: rgba(255,255,255,.02); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px;
    font-size: 11px; font-family: var(--mono); border: 1px solid var(--line); background: var(--panel-2);
    white-space: nowrap;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .pill.running { color: #9ef0bb; border-color: rgba(63,208,122,.4); }
  .pill.running::before { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .pill.pending { color: #f0d9a0; border-color: rgba(227,179,65,.35); }
  .pill.pending::before { background: var(--warn); }
  .pill.bad { color: #ffb5bb; border-color: rgba(240,97,109,.4); }
  .pill.bad::before { background: var(--bad); }
  .links { display: flex; gap: 10px; flex-wrap: wrap; }
  .links a { color: #8ec7ff; text-decoration: none; font-size: 12px; }
  .links a:hover { text-decoration: underline; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }
  .jobs { display: grid; gap: 8px; }
  .job { display: flex; gap: 10px; align-items: baseline; font: 12px var(--mono); color: var(--muted); }
  .job b { color: var(--text); font-weight: 600; }
  .toast {
    position: fixed; right: 20px; bottom: 20px; max-width: 420px; display: grid; gap: 8px; z-index: 20;
  }
  .toast div {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 10px 12px; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.45);
  }
  .toast div.err { border-left-color: var(--bad); }
  .health-grid {
    padding: 12px; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  }
  .hcard {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid #39424f;
    border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0;
  }
  .hcard.ok { border-left-color: var(--accent); }
  .hcard.warn { border-left-color: var(--warn); }
  .hcard.down { border-left-color: var(--bad); }
  .htop { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .hname { font-weight: 650; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hhost { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
  .hpill {
    margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px; background: #1e2530; color: var(--muted); white-space: nowrap;
  }
  .hpill.busy { background: rgba(63,208,122,.14); color: #9ef0bb; }
  .hpill.down { background: rgba(240,97,109,.18); color: #ffb5bb; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px 10px; }
  .stat { min-width: 0; }
  .stat .k { color: var(--muted); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat .v { font: 600 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meter { height: 3px; background: #1e242e; border-radius: 2px; margin-top: 3px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: #4f9cf0; }
  .meter i.hot { background: var(--warn); }
  .hfoot { margin-top: auto; font: 11.5px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hproblem { font-size: 12px; color: var(--warn); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hcard.down .hproblem { color: var(--bad); }
  .hidden { display: none !important; }
  .view { display: grid; gap: 20px; min-width: 0; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 3px; }
  .tab {
    background: transparent; border: 0; border-radius: 7px; padding: 5px 13px;
    font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px;
  }
  .tab:hover:not(.active) { background: var(--panel-2); color: var(--text); border-color: transparent; }
  .tab.active { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
  .tab-count { font: 11px var(--mono); color: var(--muted); }
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .toolbar input[type="search"] { flex: 1 1 220px; width: auto; min-width: 0; }
  .toolbar select { width: auto; flex: 0 0 auto; }
  .app-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px; margin-top: 14px;
  }
  .app-card {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0;
    cursor: pointer; transition: border-color .12s, background .12s;
  }
  .app-card:hover { border-color: #3c4b5e; background: #1b2431; }
  .app-card:focus-visible { outline: none; border-color: var(--accent); }
  .app-head { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .app-logo {
    width: 38px; height: 38px; flex: 0 0 38px; border-radius: 9px; overflow: hidden;
    background: #0e1319; border: 1px solid var(--line); display: grid; place-items: center;
    font: 600 16px var(--mono); color: var(--muted);
  }
  .app-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .app-titles { min-width: 0; display: grid; }
  .app-name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app-zh { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app-desc {
    font-size: 12.5px; color: #b6c2d0; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em;
  }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; }
  .chip {
    font: 10.5px var(--mono); padding: 1px 7px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--muted); background: #111823; white-space: nowrap;
  }
  .app-foot { display: flex; align-items: center; gap: 10px; font: 11.5px var(--mono); color: var(--muted); margin-top: auto; flex-wrap: wrap; }
  .app-foot button { margin-left: auto; font-size: 11.5px; padding: 4px 9px; }
  .load-more { display: flex; justify-content: center; margin-top: 16px; }
  .queue-grid { display: grid; gap: 14px; margin-top: 14px; }
  .queue-grid > .empty { grid-column: 1 / -1; }
  .qcard {
    background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid #39424f;
    border-radius: 10px; padding: 12px; display: grid; gap: 10px; min-width: 0;
  }
  .qcard.ok { border-left-color: var(--accent); }
  .qcard.warn { border-left-color: var(--warn); }
  .qcard.down { border-left-color: var(--bad); }
  .qhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .qdot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; background: var(--muted); }
  .qdot.ok { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .qdot.warn { background: var(--warn); }
  .qdot.down { background: var(--bad); }
  .qname { font-weight: 650; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qcounts { font: 11.5px var(--mono); color: var(--muted); }
  .qsection { display: grid; gap: 6px; min-width: 0; }
  .qlabel { font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .qrun { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
  .qrun-label { font-size: 13px; flex: 1 1 200px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qtime { font: 600 13px var(--mono); color: #9ef0bb; }
  .qmodels { display: flex; gap: 5px; flex-wrap: wrap; min-width: 0; }
  .qpending { display: grid; gap: 4px; }
  .qrow { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font: 12px var(--mono); color: var(--muted); }
  .qrow b { color: var(--text); font-weight: 600; }
  .qplain { font: 11.5px var(--mono); color: var(--muted); }
  .qfin { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .qtile {
    position: relative; flex: 0 0 96px; border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; background: #0a0e13; min-width: 0;
  }
  .qtile.clickable { cursor: zoom-in; }
  .qtile.clickable:hover { border-color: #3c4b5e; }
  .qtile.clickable:focus-visible { outline: none; border-color: var(--accent); }
  .qtile-media { height: 70px; display: grid; place-items: center; overflow: hidden; }
  .qtile-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .qtile-play { font-size: 22px; color: var(--muted); }
  .qtile-badge {
    position: absolute; top: 4px; left: 4px; font: 10px var(--mono);
    padding: 0 5px; border-radius: 99px;
  }
  .qtile-badge.success { background: rgba(63,208,122,.9); color: #05230f; }
  .qtile-badge.error { background: rgba(240,97,109,.9); color: #2a0508; }
  .qtile-name { font: 10.5px var(--mono); color: var(--muted); padding: 4px 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 30; padding: 20px; display: none;
    background: rgba(5,8,11,.72); backdrop-filter: blur(3px); overflow-y: auto;
  }
  .modal-backdrop.show { display: flex; align-items: center; justify-content: center; }
  body.modal-open { overflow: hidden; }
  .asset-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px; margin-top: 14px;
  }
  .asset-grid > .empty, .asset-grid > .asset-error { grid-column: 1 / -1; }
  .asset-error { display: grid; gap: 10px; justify-items: center; }
  .toolbar label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .asset-tile {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; display: flex; flex-direction: column; min-width: 0;
  }
  .asset-tile.clickable { cursor: zoom-in; transition: border-color .12s; }
  .asset-tile.clickable:hover { border-color: #3c4b5e; }
  .asset-tile.clickable:focus-visible { outline: none; border-color: var(--accent); }
  .asset-media { background: #0a0e13; display: grid; place-items: center; overflow: hidden; }
  .asset-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .asset-media video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .asset-missing { font: 11px var(--mono); color: var(--muted); padding: 18px 0; }
  .asset-audio { display: grid; gap: 8px; padding: 12px; width: 100%; }
  .asset-audio-name { font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .asset-audio audio { width: 100%; }
  .asset-foot { padding: 8px 10px; display: grid; gap: 2px; border-top: 1px solid var(--line); min-width: 0; }
  .asset-name { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .asset-sub { font: 11px var(--mono); color: var(--muted); }
  .lightbox { max-width: min(1100px, 96vw); }
  .lightbox-body { display: grid; place-items: center; min-height: 0; }
  .lightbox-body img { max-width: 100%; max-height: 68vh; object-fit: contain; border-radius: 8px; }
  .lightbox-link { color: #8ec7ff; text-decoration: none; font-size: 12.5px; }
  .lightbox-link:hover { text-decoration: underline; }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    width: 100%; max-width: 760px; margin: auto; max-height: calc(100vh - 40px);
    display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .modal-head {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  .modal-head > div { min-width: 0; }
  .detail-name { font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
  .detail-sub { font: 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .modal-body { padding: 14px 16px; overflow-y: auto; display: grid; gap: 12px; min-height: 80px; }
  .detail-desc { margin: 0; font-size: 13px; color: #c3cdd8; }
  .detail-desc.zh { font-size: 12px; color: var(--muted); }
  .detail-title { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .version-row { display: grid; gap: 3px; padding: 9px 0; border-top: 1px solid var(--line); }
  .version-head { display: flex; gap: 10px; align-items: center; }
  .version-name { font: 600 12.5px var(--mono); overflow-wrap: anywhere; }
  .version-head button { margin-left: auto; font-size: 11.5px; padding: 3px 9px; }
  .version-meta { font: 11.5px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .version-cmd {
    font: 11.5px var(--mono); color: #9fb4c9; background: #0e1319; border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 7px; overflow-wrap: anywhere;
  }
  .modal-foot {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 12px 16px; border-top: 1px solid var(--line);
  }
  @media (max-width: 760px) {
    main { padding: 16px; }
    .app-grid { grid-template-columns: 1fr; }
    .asset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .toolbar input[type="search"] { flex: 1 1 100%; }
    .modal-backdrop { padding: 10px; }
    .scroll { overflow-x: auto; }
    table { min-width: 0; }
    th:nth-child(3), td:nth-child(3),
    th:nth-child(4), td:nth-child(4),
    th:nth-child(5), td:nth-child(5) { display: none; }
    .grid4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .stat .v { font-size: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>AutoDL deploy console <span>/ pro pay-as-you-go</span></h1>
  <nav class="tabs" role="tablist" aria-label="Console views">
    <button class="tab active" id="tabDeploy" role="tab" aria-selected="true" aria-controls="viewDeploy" type="button">Deploy</button>
    <button class="tab" id="tabBrowse" role="tab" aria-selected="false" aria-controls="viewBrowse" type="button">
      Browse <span class="tab-count" id="browseTotal"></span>
    </button>
    <button class="tab" id="tabAssets" role="tab" aria-selected="false" aria-controls="viewAssets" type="button">Assets</button>
    <button class="tab" id="tabQueues" role="tab" aria-selected="false" aria-controls="viewQueues" type="button">
      Queues <span class="tab-count" id="queueCount"></span>
    </button>
  </nav>
  <div class="spacer"></div>
  <label class="meta" style="display:flex;align-items:center;gap:6px;cursor:pointer">
    <input type="checkbox" id="auto" checked style="width:auto"> auto-refresh
  </label>
  <div class="meta" id="updated">never updated</div>
</header>

<main>
  <div class="banner" id="banner" role="alert"></div>

  <div class="view" id="viewDeploy">
  <section class="card">
    <h2>Deploy instance</h2>
    <div class="card-body">
      <form id="deploy">
        <label>GPU slot <select id="gpu"></select></label>
        <label>Data centers <span class="checks" id="dc"></span></label>
        <label>Name <input id="name" placeholder="optional" autocomplete="off"></label>
        <label>Extra system disk (GB) <input id="disk" type="number" min="0" max="500" value="0"></label>
        <div class="checks" style="padding:8px 0">
          <label><input type="checkbox" id="waitStock" checked> Queue until a slot frees</label>
        </div>

        <label>Application <select id="app"></select></label>
        <label>Version <select id="version"></select></label>
        <label>Filter apps <input id="appFilter" placeholder="type a name…" autocomplete="off"></label>
        <div class="status-line" id="appInfo" style="grid-column:1/-1"></div>

        <div class="actions">
          <button class="primary" id="deployBtn" type="submit">Deploy</button>
          <button class="ghost" id="refreshGpu" type="button">Refresh inventory</button>
          <div class="status-line" id="deployStatus"></div>
        </div>
      </form>
    </div>
  </section>

  <section class="card">
    <h2>Health <span class="mono" id="healthSummary"></span></h2>
    <div class="health-grid" id="health"><div class="empty">waiting for stats…</div></div>
  </section>

  <section class="card">
    <h2>Instances <span class="mono" id="count"></span></h2>
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th>Instance</th><th>Status</th><th>GPU</th><th>Region</th>
            <th>Price</th><th>Endpoints</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="7" class="empty">loading…</td></tr></tbody>
      </table>
    </div>
    <div class="card-body jobs" id="jobs"></div>
  </section>
  </div>

  <section class="card hidden" id="viewBrowse" aria-labelledby="browseHeading">
    <h2 id="browseHeading">Marketplace <span class="mono" id="browseCount"></span></h2>
    <div class="card-body">
      <div class="toolbar">
        <input id="browseSearch" type="search" placeholder="Search applications…" autocomplete="off" aria-label="Search applications">
        <select id="browseSort" aria-label="Sort applications">
          <option value="stars">Most stars</option>
          <option value="name">Name</option>
          <option value="updated">Recently updated</option>
        </select>
        <div class="status-line" id="browseStatus"></div>
      </div>
      <div class="app-grid" id="appGrid"><div class="empty">loading…</div></div>
      <div class="load-more"><button id="browseMore" type="button" hidden>Load more</button></div>
    </div>

  <section class="card hidden" id="viewAssets" aria-labelledby="assetsHeading">
    <h2 id="assetsHeading">ComfyUI outputs <span class="mono" id="assetCount"></span></h2>
    <div class="card-body">
      <div class="toolbar">
        <label>Instance <select id="assetInstance" aria-label="Instance"></select></label>
        <label>Kind
          <select id="assetKind" aria-label="Filter by kind">
            <option value="all">All</option>
          </select>
        </label>
        <button id="assetRefresh" type="button">Refresh</button>
        <div class="status-line" id="assetStatus"></div>
      </div>
      <div class="asset-grid" id="assetGrid"><div class="empty">loading…</div></div>
    </div>
  </section>

  <section class="card hidden" id="viewQueues" aria-labelledby="queuesHeading">
    <h2 id="queuesHeading">Queues <span class="mono" id="queueSummary"></span></h2>
    <div class="card-body">
      <div class="toolbar">
        <button id="queueRefresh" type="button">Refresh</button>
        <div class="status-line" id="queueStatus"></div>
      </div>
      <div class="queue-grid" id="queues"><div class="empty">loading…</div></div>
    </div>

</main>

<div class="modal-backdrop" id="lightbox">
  <div class="modal lightbox" role="dialog" aria-modal="true" aria-labelledby="lightboxName">
    <div class="modal-head">
      <div>
        <div class="detail-name" id="lightboxName"></div>
        <div class="detail-sub" id="lightboxSub"></div>

      <a class="lightbox-link" id="lightboxLink" href="#" target="_blank" rel="noreferrer">Open original</a>

<div class="modal-backdrop" id="detail">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailName">
    <div class="modal-head">
      <div>
        <div class="detail-name" id="detailName">loading…</div>
        <div class="detail-sub" id="detailSub"></div>
      </div>
      <button class="ghost" id="detailClose" type="button" style="margin-left:auto" aria-label="Close application details">Close</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot">
      <button class="primary" id="detailSelect" type="button" disabled>Select for deploy</button>
      <div class="status-line" id="detailStatus"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { instances: [], jobs: [], pending: new Set(), config: null, health: null, apps: [], pollTimer: null,
  browse: { q: "", sort: "stars", offset: 0, total: 0, apps: [], loading: false, loaded: false, hasMore: false },
  assets: { uuid: "", kind: "all", total: 0, kinds: {}, assets: [], loading: false, seq: 0,
    instanceSignature: null, error: "" },
  queues: { boxes: [], loaded: false, loading: false, seq: 0, error: "", timer: null },
  detail: null, lightbox: null };
const STEPS = new Set(["creating", "created", "sys_volume_creating", "starting"]);
const BAD = new Set(["create_failed", "pull_image_failed", "shutdown_by_starting_error"]);

function toast(message, isError) {
  const node = document.createElement("div");
  if (isError) node.className = "err";
  node.textContent = message;
  $("toast").append(node);
  setTimeout(() => node.remove(), isError ? 9000 : 4500);
}

async function api(path, options) {
  const response = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  let body = null;
  try { body = await response.json(); } catch { /* empty body */ }
  if (!response.ok) {
    const detail = body && body.detail;
    throw new Error(typeof detail === "string" ? detail : detail ? JSON.stringify(detail) : `HTTP ${response.status}`);
  }
  return body;
}

function statusClass(status) {
  if (status === "running") return "pill running";
  if (BAD.has(status)) return "pill bad";
  if (status === "shutdown") return "pill";
  return "pill pending";
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  for (const child of children || []) node.append(child);
  return node;
}

function renderInstances() {
  const rows = $("rows");
  rows.textContent = "";
  $("count").textContent = state.instances.length ? `${state.instances.length}` : "";
  if (!state.instances.length) {
    rows.append(el("tr", {}, [el("td", { colSpan: 7, className: "empty" }, ["no instances"])]));
    return;
  }
  for (const item of state.instances) {
    const job = state.jobs.find((entry) => entry.uuid === item.uuid);
    const busy = job && ["queued", "powering_off", "releasing"].includes(job.state);

    const identity = el("td", {}, [
      el("div", { className: "mono" }, [item.uuid]),
      (item.name || item.app || item.version) ? el("div", { className: "muted", style: "font-size:12px" }, [
        [item.name, item.app && `${item.app} ${item.version}`].filter(Boolean).join(" · "),
      ]) : null,
    ]);

    const status = el("td", {}, [
      el("span", { className: statusClass(item.status), textContent: item.status || "?" }),
      item.sub_status ? el("div", { className: "muted mono", style: "margin-top:4px" }, [item.sub_status]) : null,
      job ? el("div", { className: "muted mono", style: "margin-top:4px" }, [`${job.state}: ${job.message}`]) : null,
    ].filter(Boolean));

    const links = el("td", {}, [
      el("div", { className: "links" }, [
        item.comfy ? el("a", { href: item.comfy, target: "_blank", rel: "noreferrer", textContent: "comfy" }) : null,
        item.panel ? el("a", { href: item.panel, target: "_blank", rel: "noreferrer", textContent: "panel" }) : null,
        item.jupyter ? el("a", { href: item.jupyter, target: "_blank", rel: "noreferrer", textContent: "jupyter" }) : null,
        item.ssh ? el("a", { href: "#", textContent: "copy ssh", onclick: (event) => {
          event.preventDefault();
          navigator.clipboard.writeText(item.ssh).then(() => toast(`copied ${item.ssh}`), () => toast(item.ssh));
        } }) : null,
      ].filter(Boolean)),
    ]);

    const actions = el("td", {}, [
      el("div", { className: "row-actions" }, [
        el("button", { textContent: "Assets", onclick: () => openAssets(item.uuid) }),
        el("button", {
          textContent: "Power on",
          disabled: busy || !["shutdown"].includes(item.status),
          onclick: () => power(item, "power_on"),
        }),
        el("button", {
          textContent: "Power off",
          disabled: busy || ["shutdown", "released"].includes(item.status),
          onclick: () => power(item, "power_off"),
        }),
        el("button", {
          className: "danger",
          textContent: busy ? job.state : "Release",
          disabled: busy,
          onclick: () => release(item),
        }),
      ]),
    ]);

    rows.append(el("tr", {}, [
      identity,
      status,
      el("td", { className: "mono" }, [item.gpu || "—"]),
      el("td", { className: "muted" }, [item.region || "—"]),
      el("td", { className: "mono" }, [item.price_per_hour ? `¥${item.price_per_hour.toFixed(2)}/h` : "—"]),
      links,
      actions,
    ]));
  }
  syncAssetInstances();
}

function renderJobs() {
  const box = $("jobs");
  box.textContent = "";
  const active = state.jobs.filter((job) => !["released", "cancelled"].includes(job.state));
  if (!active.length) return;
  box.append(el("div", { className: "muted", style: "font-size:11px;text-transform:uppercase;letter-spacing:.07em" }, ["jobs"]));
  for (const job of active) {
    const cancellable = job.kind === "deploy" && ["queued", "waiting", "retrying"].includes(job.state);
    box.append(el("div", { className: "job" }, [
      el("b", { textContent: `${job.kind} ${job.uuid || job.id}` }),
      el("span", { textContent: `${job.state} — ${job.message}` }),
      el("span", { className: "muted", textContent: job.updated_at.slice(11, 19) }),
      cancellable ? el("button", { className: "ghost", textContent: "Cancel", onclick: () => cancelJob(job.id) }) : null,
    ].filter(Boolean)));
  }
}

async function cancelJob(id) {
  try {
    await api(`/api/jobs/${encodeURIComponent(id)}`, { method: "DELETE" });
    toast(`cancelled ${id}`);
    refresh();
  } catch (error) {
    toast(`cancel failed: ${error.message}`, true);
  }
}

// --- health cards (ported from the DO gpu-panel) ------------------------------------------------------
const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const gib = (bytes) => (Number(bytes) / 1024 ** 3).toFixed(1);
const fixed = (value, digits = 0) => (typeof value === "number" && isFinite(value) ? value.toFixed(digits) : "—");
const ratio = (part, whole) => (whole ? part / whole : 0);
const meter = (fraction, hot) =>
  `<div class="meter"><i class="${hot ? "hot" : ""}" style="width:${Math.max(0, Math.min(1, fraction || 0)) * 100}%"></i></div>`;
const tile = (key, value, fraction, hot) =>
  `<div class="stat"><div class="k">${esc(key)}</div><div class="v">${esc(value)}</div>${fraction === undefined ? "" : meter(fraction, hot)}</div>`;
const clock = (seconds) => {
  const total = Math.max(0, Math.round(seconds || 0));
  return `${String(Math.floor(total / 60)).padStart(2, "0")}:${String(total % 60).padStart(2, "0")}`;
};
const humanDuration = (seconds) => {
  const total = Math.max(0, Math.round(seconds || 0));
  if (total >= 86_400) return `${Math.floor(total / 86_400)}d ${Math.floor(total % 86_400 / 3600)}h`;
  if (total >= 3600) return `${Math.floor(total / 3600)}h ${Math.floor(total % 3600 / 60)}m`;
  return `${Math.floor(total / 60)}m`;
};

const REGIONS = {
  "西北": "Northwest", "华北": "North", "华东": "East", "华南": "South",
  "西南": "Southwest", "华中": "Central", "东北": "Northeast",
  "北京": "Beijing", "内蒙": "Inner Mongolia", "上海": "Shanghai",
};

function regionLabel(region) {
  let text = String(region || "");
  for (const [zh, en] of Object.entries(REGIONS)) text = text.replace(zh, en);
  return text.replace(/区/g, " ").replace(/([a-z])([A-Z])\b/g, "$1 $2").replace(/\s+/g, " ").trim();
}

function boxTitle(box) {
  // a named instance wins; otherwise say what the box is, not which random uuid it has
  if (box.name && box.name !== box.uuid) return box.name;
  const parts = [box.gpu, regionLabel(box.region)].filter(Boolean);
  return parts.length ? parts.join(" · ") : String(box.uuid || "").slice(4);
}

function healthCard(box) {
  const host = box.host || {};
  const gpu = (host.gpus || [])[0] || {};
  const comfy = box.comfy_state || {};
  const level = box.level || "unknown";
  const busy = (comfy.running || 0) > 0;
  const pill = level === "down"
    ? '<span class="hpill down">DOWN</span>'
    : busy ? '<span class="hpill busy">PROCESSING</span>' : '<span class="hpill">IDLE</span>';

  const hasHost = Boolean(host.gpus && host.gpus.length);
  const gpuRow = !hasHost ? "" : [
    tile("GPU", `${fixed(gpu.util)}%`, (gpu.util || 0) / 100),
    tile("VRAM", `${fixed((gpu.mem_used || 0) / 1024, 1)}/${fixed((gpu.mem_total || 0) / 1024, 1)}G`,
      ratio(gpu.mem_used || 0, gpu.mem_total || 1), ratio(gpu.mem_used || 0, gpu.mem_total || 1) > 0.95),
    tile("Temp", `${fixed(gpu.temp)}°C`, (gpu.temp || 0) / 100, (gpu.temp || 0) >= 85),
    tile("Power", `${fixed(gpu.power)} W`, (gpu.power || 0) / (gpu.power_limit || 700)),
  ].join("");

  const hostRow = !hasHost ? "" : [
    host.mem ? tile("RAM", `${gib(host.mem.used)}/${gib(host.mem.total)}G`,
      ratio(host.mem.used, host.mem.total), ratio(host.mem.used, host.mem.total) > 0.9) : "",
    ...Object.entries(host.disks || {}).slice(0, 2).map(([path, disk]) => tile(
      path === "/" ? "Disk root" : `${path.split("/").pop()} free`,
      `${gib(disk.total - disk.used)}G`, ratio(disk.used, disk.total), ratio(disk.used, disk.total) > 0.9)),
    (host.load && host.cpus) ? tile("Load", `${fixed(host.load[0], 1)}/${host.cpus}`,
      ratio(host.load[0], host.cpus)) : "",
  ].filter(Boolean).slice(0, 4).join("");

  // no SSH yet: ComfyUI's own /system_stats still gives VRAM and RAM
  const fallbackRow = (!hasHost && comfy.vram_total) ? [
    tile("VRAM", `${gib(comfy.vram_total - comfy.vram_free)}/${gib(comfy.vram_total)}G`,
      ratio(comfy.vram_total - comfy.vram_free, comfy.vram_total)),
    comfy.ram_total ? tile("RAM", `${gib(comfy.ram_total - comfy.ram_free)}/${gib(comfy.ram_total)}G`,
      ratio(comfy.ram_total - comfy.ram_free, comfy.ram_total)) : "",
    tile("Queue", `${comfy.pending || 0}`),
  ].filter(Boolean).join("") : "";

  const activity = level === "down"
    ? `<div class="hproblem">${esc(box.host_error || "host unreachable")}</div>`
    : busy
      ? `<div class="hfoot" style="color:var(--text)">running <b data-since="${esc(comfy.started_at || "")}">${esc(clock(comfy.started_at ? box.now / 1000 - (comfy.started_at > 1e12 ? comfy.started_at / 1000 : comfy.started_at) : 0))}</b> · ${comfy.pending || 0} queued</div>`
      : `<div class="hfoot">queue empty${comfy.version ? ` · ComfyUI ${esc(comfy.version)}` : ""}</div>`;

  const foot = [
    comfy.version ? `v${comfy.version}` : "",
    host.uptime_s ? `up ${esc(humanDuration(host.uptime_s))}` : "",
    box.host_age_s !== null && box.host_age_s !== undefined ? `stats ${fixed(box.host_age_s)}s old` : "no ssh stats",
  ].filter(Boolean).join(" · ");

  const problems = box.problems && box.problems.length && level !== "down"
    ? `<div class="hproblem">⚠ ${esc(box.problems.join(" · "))}</div>` : "";

  return `<div class="hcard ${level}">
    <div class="htop"><span class="hname" title="${esc(box.uuid)}">${esc(boxTitle(box))}</span><span class="hhost">${esc(box.uuid.replace(/^pro-/, ""))}</span>${pill}</div>
    ${activity}
    ${gpuRow ? `<div class="grid4">${gpuRow}</div>` : ""}
    ${hostRow ? `<div class="grid4">${hostRow}</div>` : ""}
    ${fallbackRow ? `<div class="grid4">${fallbackRow}</div>` : ""}
    ${problems}
    <div class="hfoot">${esc(foot)}</div>
  </div>`;
}

function renderHealth(data) {
  state.health = data;
  const boxes = data.boxes || [];
  const healthy = boxes.filter((box) => box.level === "ok").length;
  const busy = boxes.filter((box) => (box.comfy_state?.running || 0) > 0).length;
  $("healthSummary").textContent = boxes.length ? `${healthy}/${boxes.length} healthy · ${busy} processing` : "";
  $("health").innerHTML = boxes.length
    ? boxes.map((box) => healthCard({ ...box, now: data.now })).join("")
    : '<div class="empty">no running instances</div>';
}

async function loadHealth() {
  try {
    renderHealth(await api("/api/health"));
  } catch (error) {
    $("health").innerHTML = `<div class="empty">${esc(error.message)}</div>`;
  }
}

function tickHealth() {
  const nowSeconds = Date.now() / 1000;
  for (const node of document.querySelectorAll("[data-since]")) {
    let since = Number(node.dataset.since);
    if (!isFinite(since) || since <= 0) continue;
    if (since > 1e12) since /= 1000;
    node.textContent = clock(nowSeconds - since);
  }
  // queue row timers ride the same 1s ticker (queues tab only, cheap when empty)
  for (const node of document.querySelectorAll("[data-queue-start]")) {
    node.textContent = queueElapsed(node.dataset.queueStart);
  }
}

async function refresh() {
  try {
    const data = await api("/api/instances");
    state.instances = data.instances;
    state.jobs = data.jobs;
    for (const uuid of [...state.pending]) {
      const found = state.instances.find((item) => item.uuid === uuid);
      if (found && (found.status === "running" || BAD.has(found.status))) {
        state.pending.delete(uuid);
        if (found.status === "running") toast(`${uuid} is running`);
        if (found.comfy) window.open(found.comfy, "_blank", "noreferrer");
      }
    }
    renderInstances();
    renderJobs();
    $("banner").classList.remove("show");
    const now = new Date();
    $("updated").textContent = `updated ${now.toTimeString().slice(0, 8)}`;
    if (state.pending.size && !state.fastPoll) {
      state.fastPoll = true;
      setTimeout(() => { state.fastPoll = false; refresh(); }, 3000);
    }
  } catch (error) {
    console.error("refresh failed", error);
    showBanner(error.message);
  }
}

function showBanner(message) {
  const banner = $("banner");
  banner.textContent = message;
  banner.classList.add("show");
}

const appName = (app) => `${app.name_en || app.name} — #${app.id}`;

// English is primary: fall back to the Chinese field and show it once when the translation is missing or identical.
function pick(app, base) {
  const source = (app[base] || "").trim();
  const english = (app[`${base}_en`] || "").trim();
  const translated = english && english !== source;
  return { primary: translated ? english : source, secondary: translated ? source : "" };
}

function tagList(app) {
  const english = parseTags(app.tags_en);
  return english.length ? english : parseTags(app.tags);
}

function parseTags(value) {
  if (Array.isArray(value)) return value.filter(Boolean).map(String);
  if (typeof value !== "string" || !value.trim()) return [];
  try {
    const parsed = JSON.parse(value);
    if (Array.isArray(parsed)) return parsed.filter(Boolean).map(String);
  } catch { /* not json, treat as a comma list */ }
  return value.split(",").map((tag) => tag.trim()).filter(Boolean);
}

function fillApps(filter = "", skipVersions = false) {
  const select = $("app");
  const previous = select.value;
  const needle = filter.trim().toLowerCase();
  select.textContent = "";
  const rows = (state.apps || []).filter((app) => !needle || String(app.name || "").toLowerCase().includes(needle));
  for (const app of rows) {
    select.append(el("option", { value: String(app.id), textContent: appName(app) }));
  }
  const keep = rows.some((app) => String(app.id) === previous) ? previous : (rows[0] ? String(rows[0].id) : "");
  select.value = keep;
  if (!skipVersions) loadVersions();
}

async function loadApps() {
  try {
    const data = await api("/api/apps?limit=500");
    state.apps = data.apps || [];
    const murad = state.apps.find((app) => app.id === 313);
    fillApps();
    if (murad) { $("app").value = "313"; loadVersions(); }
    $("appFilter").oninput = (event) => fillApps(event.target.value);
    $("app").onchange = loadVersions;
  } catch (error) {
    toast(`catalog: ${error.message}`, true);
  }
}

async function loadVersions() {
  const appId = $("app").value;
  const select = $("version");
  select.textContent = "";
  $("appInfo").textContent = "";
  if (!appId) return;
  try {
    const data = await api(`/api/apps/${encodeURIComponent(appId)}`);
    if ($("app").value !== appId) return;  // a newer selection won the race
    const versions = data.versions || [];
    for (const version of versions) {
      const size = version.image_size ? `${(version.image_size / 1024 ** 3).toFixed(1)} GB` : "";
      select.append(el("option", {
        value: String(version.id),
        textContent: `${version.image_version} · ${version.framework || ""}${version.cuda_v ? ` CUDA ${version.cuda_v}` : ""} · ${size} (#${version.id})`,
      }));
    }
    if (versions.length) select.value = String(versions[0].id);
    showVersionInfo(versions);
    select.onchange = () => showVersionInfo(versions);
  } catch (error) {
    toast(`versions: ${error.message}`, true);
  }
}

function showVersionInfo(versions) {
  const version = versions.find((item) => String(item.id) === $("version").value);
  $("appInfo").textContent = version
    ? `#${version.id} · ${version.private_image_uuid || "no image uuid"} · ${version.start_command || "no start command"}`
    : "";
}

// --- tabs --------------------------------------------------------------------------------------------
const VIEWS = ["deploy", "browse", "assets", "queues"];
const cap = (name) => `${name[0].toUpperCase()}${name.slice(1)}`;

function switchTab(name) {
  const target = VIEWS.includes(name) ? name : "deploy";
  for (const view of VIEWS) {
    const active = view === target;
    $(`view${cap(view)}`).classList.toggle("hidden", !active);
    const tab = $(`tab${cap(view)}`);
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-selected", String(active));
  }
  if (target === "browse" && !state.browse.loaded) {
    state.browse.loaded = true;
    loadBrowse(true);
  }
  if (target === "assets") {
    fillAssetInstances();
    if (state.assets.uuid) loadAssets();
    else renderAssets();
  }
  if (target === "queues") {
    loadQueues();
    startQueueTimer();
  } else {
    stopQueueTimer();
  }
}

// --- browse tab --------------------------------------------------------------------------------------
const PAGE_SIZE = 50;

async function loadBrowse(reset) {
  const browse = state.browse;
  if (browse.loading) return;
  browse.loading = true;
  if (reset) {
    browse.offset = 0;
    browse.apps = [];
    $("appGrid").textContent = "";
  }
  $("browseStatus").textContent = "loading…";
  $("browseMore").disabled = true;
  try {
    const params = new URLSearchParams({ q: browse.q, sort: browse.sort, limit: String(PAGE_SIZE), offset: String(browse.offset) });
    const data = await api(`/api/apps?${params}`);
    const page = data.apps || [];
    const byId = new Map();
    for (const app of (browse.offset ? browse.apps : []).concat(page)) byId.set(app.id, app);
    browse.apps = [...byId.values()];
    browse.offset = browse.apps.length;
    browse.total = Number.isFinite(Number(data.total)) ? Number(data.total) : browse.apps.length;
    browse.hasMore = page.length > 0 && browse.offset < browse.total;
    renderBrowse();
  } catch (error) {
    $("browseStatus").textContent = "";
    if (!browse.apps.length) $("appGrid").innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    toast(`catalog: ${error.message}`, true);
  } finally {
    browse.loading = false;
    $("browseMore").disabled = false;
  }
}

function renderBrowse() {
  const browse = state.browse;
  const grid = $("appGrid");
  grid.textContent = "";
  if (!browse.apps.length) {
    grid.append(el("div", { className: "empty" }, [browse.q ? "no application matches that search" : "no applications"]));
    $("browseCount").textContent = "";
    $("browseStatus").textContent = "";
    $("browseTotal").textContent = "";
    $("browseMore").hidden = true;
    return;
  }
  for (const app of browse.apps) grid.append(appCard(app));
  $("browseCount").textContent = `${browse.total} application${browse.total === 1 ? "" : "s"}`;
  $("browseStatus").textContent = `showing ${browse.apps.length} of ${browse.total}`;
  $("browseTotal").textContent = String(browse.total);
  $("browseMore").hidden = !browse.hasMore;
}

function logoNode(app, label) {
  const box = el("div", { className: "app-logo" }, []);
  const letter = (label || "?").trim().charAt(0).toUpperCase() || "?";
  box.textContent = letter;
  if (app.logo) {
    const img = el("img", { src: app.logo, alt: `${label} logo`, loading: "lazy" }, []);
    img.addEventListener("error", () => { img.remove(); box.textContent = letter; });
    box.textContent = "";
    box.append(img);
  }
  return box;
}

function appCard(app) {
  const name = pick(app, "name");
  const desc = pick(app, "describe");
  const tags = tagList(app);
  const versions = Number(app.versions || 0);
  const stars = Number(app.star_num || 0);

  const footer = el("div", { className: "app-foot" }, [
    el("span", { textContent: `★ ${stars}` }, []),
    el("span", { className: "muted", textContent: `· ${versions} image${versions === 1 ? "" : "s"}` }, []),
    el("button", { type: "button", textContent: "Deploy this image", onclick: (event) => {
      event.stopPropagation();
      openApp(app.id, card);
    } }, []),
  ]);

  const card = el("div", {
    className: "app-card", role: "button", tabIndex: 0,
    "aria-label": `${name.primary || `application ${app.id}`} — open deployable images`,
    onclick: () => openApp(app.id, card),
    onkeydown: (event) => {
      if (event.target !== card) return;
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openApp(app.id, card);
      }
    },
  }, [
    el("div", { className: "app-head" }, [
      logoNode(app, name.primary),
      el("div", { className: "app-titles" }, [
        el("div", { className: "app-name", textContent: name.primary || `#${app.id}` }, []),
        name.secondary ? el("div", { className: "app-zh", textContent: name.secondary }, []) : null,
      ].filter(Boolean)),
    ]),
    el("div", { className: "app-desc", textContent: desc.primary || "" }, []),
    tags.length ? el("div", { className: "chips" }, tags.slice(0, 6).map((tag) => el("span", { className: "chip", textContent: tag }, []))) : null,
    footer,
  ].filter(Boolean));
  return card;
}

async function openApp(appId, opener) {
  state.detail = { id: appId, opener, app: null, versions: [] };
  $("detailName").textContent = "loading…";
  $("detailSub").textContent = `#${appId}`;
  $("detailBody").textContent = "";
  $("detailStatus").textContent = "";
  $("detailSelect").disabled = true;
  $("detail").classList.add("show");
  document.body.classList.add("modal-open");
  $("detailClose").focus();
  try {
    const data = await api(`/api/apps/${encodeURIComponent(appId)}`);
    if (!state.detail || state.detail.id !== appId) return;
    state.detail.app = data.app || { id: appId };
    state.detail.versions = data.versions || [];
    renderDetail();
  } catch (error) {
    $("detailBody").innerHTML = `<div class="empty">${esc(error.message)}</div>`;
    toast(`application: ${error.message}`, true);
  }
}

function renderDetail() {
  const detail = state.detail;
  if (!detail) return;
  const app = detail.app || {};
  const name = pick(app, "name");
  const desc = pick(app, "describe");
  const tags = tagList(app);
  const body = $("detailBody");

  $("detailName").textContent = name.primary || `#${detail.id}`;
  $("detailSub").textContent = `${name.secondary ? `${name.secondary} · ` : ""}#${detail.id}`;
  body.textContent = "";
  if (desc.primary) body.append(el("p", { className: "detail-desc", textContent: desc.primary }, []));
  if (desc.secondary) body.append(el("p", { className: "detail-desc zh", textContent: desc.secondary }, []));
  if (tags.length) {
    body.append(el("div", { className: "chips" }, tags.map((tag) => el("span", { className: "chip", textContent: tag }, []))));
  }
  body.append(el("div", { className: "detail-title" }, [
    `${detail.versions.length} deployable image${detail.versions.length === 1 ? "" : "s"}`,
  ]));
  if (!detail.versions.length) body.append(el("div", { className: "empty" }, ["no deployable image version"]));
  for (const version of detail.versions) body.append(versionRow(version));
  $("detailSelect").disabled = !detail.versions.length;
  $("detailStatus").textContent = `${Number(app.star_num || 0)} stars · ${Number(app.use_num || 0)} uses`;
}

function versionRow(version) {
  const size = version.image_size ? `${(version.image_size / 1024 ** 3).toFixed(1)} GB` : "";
  const meta = [
    version.framework, version.framework_v,
    version.cuda_v ? `CUDA ${version.cuda_v}` : "",
    size, `#${version.id}`,
  ].filter(Boolean).join(" · ");
  return el("div", { className: "version-row" }, [
    el("div", { className: "version-head" }, [
      el("span", { className: "version-name", textContent: version.image_version || `#${version.id}` }, []),
      el("button", { type: "button", textContent: "Select", onclick: () => selectForDeploy(state.detail && state.detail.app, version.id) }, []),
    ]),
    el("div", { className: "version-meta", textContent: meta }, []),
    el("div", { className: "version-meta", textContent: version.private_image_uuid || "no image uuid" }, []),
    version.start_command ? el("div", { className: "version-cmd", textContent: version.start_command }, []) : null,
  ].filter(Boolean));
}

function closeDetail(options) {
  const opener = state.detail && state.detail.opener;
  $("detail").classList.remove("show");
  document.body.classList.remove("modal-open");
  state.detail = null;
  const restore = !options || options.restoreFocus !== false;
  if (restore && opener && document.body.contains(opener)) opener.focus();
}

async function selectForDeploy(app, versionId) {
  if (!app || !app.id) return;
  closeDetail({ restoreFocus: false });
  const id = String(app.id);
  $("appFilter").value = "";
  if (!(state.apps || []).some((entry) => String(entry.id) === id)) state.apps = [app, ...(state.apps || [])];
  fillApps("", true);
  $("app").value = id;
  await loadVersions();
  const select = $("version");
  if (versionId !== undefined && versionId !== null) {
    const value = String(versionId);
    if (![...select.options].some((option) => option.value === value)) {
      select.append(el("option", { value, textContent: `#${value}` }, []));
    }
    select.value = value;
    if (typeof select.onchange === "function") select.onchange();
  }
  switchTab("deploy");
  $("app").focus({ preventScroll: true });
  $("deploy").scrollIntoView({ behavior: "smooth", block: "start" });
  toast(`selected ${app.name || `#${id}`} for deploy`);
}

// --- assets tab --------------------------------------------------------------------------------------
const KIND_LABELS = { image: "Images", video: "Video", audio: "Audio" };
const KIND_ORDER = ["image", "video", "audio"];

const runningInstances = () => (state.instances || []).filter((item) => item.status === "running");
const assetPath = (asset) => `${asset.subfolder ? `${asset.subfolder}/` : ""}${asset.filename}`;

function ago(ms) {
  if (!ms) return "unknown time";
  const seconds = Math.max(0, Math.round((Date.now() - Number(ms)) / 1000));
  if (seconds < 60) return `${seconds}s ago`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  return `${Math.floor(seconds / 86400)}d ago`;
}

function assetFileUrl(asset, uuid = state.assets.uuid) {
  return `/api/assets/file?${new URLSearchParams({
    uuid,
    filename: asset.filename,
    subfolder: asset.subfolder || "",
    type: asset.type || "output",
  })}`;
}

function fillAssetInstances() {
  const select = $("assetInstance");
  const running = runningInstances();
  const previous = state.assets.uuid || select.value;
  select.textContent = "";
  for (const item of running) {
    select.append(el("option", { value: item.uuid, textContent: item.name || item.uuid }, []));
  }
  const keep = running.some((item) => item.uuid === previous) ? previous : (running[0] ? running[0].uuid : "");
  select.value = keep;
  state.assets.uuid = keep;
  return keep;
}

function syncAssetInstances() {
  const signature = runningInstances().map((item) => item.uuid).join("|");
  if (signature === state.assets.instanceSignature) return;
  state.assets.instanceSignature = signature;
  const previous = state.assets.uuid;
  fillAssetInstances();
  if (previous && state.assets.uuid !== previous) {
    state.assets.assets = [];
    state.assets.total = 0;
    state.assets.error = "";
  }
  if ($("viewAssets").classList.contains("hidden")) return;
  if (state.assets.uuid) loadAssets();
  else renderAssets();
}

function fillAssetKinds() {
  const select = $("assetKind");
  const kinds = state.assets.kinds || {};
  select.textContent = "";
  select.append(el("option", { value: "all", textContent: "All" }, []));
  for (const kind of KIND_ORDER) {
    if (Number(kinds[kind] || 0) > 0) {
      select.append(el("option", { value: kind, textContent: KIND_LABELS[kind] }, []));
    }
  }
  if (![...select.options].some((option) => option.value === state.assets.kind)) state.assets.kind = "all";
  select.value = state.assets.kind;
}

async function loadAssets() {
  const assets = state.assets;
  const uuid = assets.uuid;
  if (!uuid) return;
  if (assets.loading) return;
  assets.loading = true;
  const seq = ++assets.seq;
  $("assetStatus").textContent = "loading…";
  try {
    const data = await api(`/api/assets?uuid=${encodeURIComponent(uuid)}&limit=60`);
    if (seq !== assets.seq) return;
    assets.assets = data.assets || [];
    assets.total = Number.isFinite(Number(data.total)) ? Number(data.total) : assets.assets.length;
    assets.kinds = data.kinds || {};
    assets.error = "";
  } catch (error) {
    if (seq !== assets.seq) return;
    assets.assets = [];
    assets.total = 0;
    assets.kinds = {};
    assets.error = error.message;
  } finally {
    if (seq === assets.seq) {
      assets.loading = false;
      $("assetStatus").textContent = "";
    }
  }
  if (seq !== assets.seq) return;
  fillAssetKinds();
  renderAssets();
}

function filteredAssets() {
  const assets = state.assets;
  return assets.kind === "all" ? assets.assets : assets.assets.filter((asset) => asset.kind === assets.kind);
}

function renderAssets() {
  const assets = state.assets;
  const grid = $("assetGrid");
  grid.textContent = "";
  $("assetCount").textContent = assets.total ? String(assets.total) : "";

  if (!runningInstances().length) {
    grid.append(el("div", { className: "empty" }, ["start an instance to see its output"]));
    return;
  }
  if (!assets.uuid) {
    grid.append(el("div", { className: "empty" }, ["select an instance to see its output"]));
    return;
  }
  if (assets.error) {
    grid.append(el("div", { className: "empty asset-error" }, [
      el("div", { textContent: assets.error }, []),
      el("button", { type: "button", textContent: "Retry", onclick: () => loadAssets() }, []),
    ]));
    return;
  }
  const rows = filteredAssets();
  if (!rows.length) {
    grid.append(el("div", { className: "empty" }, [assets.assets.length ? "no outputs of that kind" : "no outputs yet"]));
    return;
  }
  for (const asset of rows) grid.append(assetTile(asset));
  if (rows.length !== assets.assets.length) $("assetStatus").textContent = `${rows.length} of ${assets.assets.length} shown`;
}

function assetTile(asset) {
  const url = assetFileUrl(asset);
  const ratio = asset.width && asset.height ? `${asset.width} / ${asset.height}` : "1 / 1";
  const media = el("div", { className: "asset-media", style: `aspect-ratio:${ratio}` }, []);
  const missing = () => {
    media.textContent = "";
    media.append(el("div", { className: "asset-missing", textContent: "missing" }, []));
  };

  if (asset.kind === "image") {
    const img = el("img", { src: url, alt: asset.filename, loading: "lazy" }, []);
    img.addEventListener("error", missing);
    media.append(img);
  } else if (asset.kind === "video") {
    const video = el("video", { src: url, controls: true, preload: "metadata" }, []);
    video.addEventListener("error", missing);
    media.append(video);
  } else {
    media.style.aspectRatio = "auto";
    media.append(el("div", { className: "asset-audio" }, [
      el("div", { className: "asset-audio-name", textContent: asset.filename, title: assetPath(asset) }, []),
      el("audio", { src: url, controls: true, preload: "metadata" }, []),
    ]));
  }

  const foot = el("div", { className: "asset-foot" }, [
    el("div", { className: "asset-name", textContent: asset.filename, title: assetPath(asset) }, []),
    el("div", { className: "asset-sub" }, [
      asset.width && asset.height ? `${asset.width}×${asset.height}` : "—",
      ` · ${ago(asset.created_at)}`,
    ]),
  ]);

  const tile = el("div", { className: "asset-tile" }, [media, foot]);
  if (asset.kind === "image") {
    tile.classList.add("clickable");
    tile.setAttribute("role", "button");
    tile.setAttribute("aria-label", `Open ${asset.filename}`);
    tile.tabIndex = 0;
    tile.addEventListener("click", () => openLightbox(asset, tile));
    tile.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openLightbox(asset, tile);
      }
    });
  }
  return tile;
}

function openLightbox(asset, opener, uuid = state.assets.uuid) {
  const url = assetFileUrl(asset, uuid);
  state.lightbox = { asset, opener };
  $("lightboxName").textContent = asset.filename;
  $("lightboxSub").textContent = assetPath(asset);
  $("lightboxMeta").textContent = [
    asset.width && asset.height ? `${asset.width} × ${asset.height}` : "",
    ago(asset.created_at),
    asset.type || "",
  ].filter(Boolean).join(" · ");
  $("lightboxLink").href = url;
  const body = $("lightboxBody");
  body.textContent = "";
  const img = el("img", { src: url, alt: asset.filename }, []);
  img.addEventListener("error", () => {
    body.textContent = "";
    body.append(el("div", { className: "empty" }, ["preview failed to load — use Open original"]));
  });
  body.append(img);
  $("lightbox").classList.add("show");
  document.body.classList.add("modal-open");
  $("lightboxClose").focus();
}

function closeLightbox() {
  const opener = state.lightbox && state.lightbox.opener;
  $("lightbox").classList.remove("show");
  document.body.classList.remove("modal-open");
  state.lightbox = null;
  if (opener && document.body.contains(opener)) opener.focus();
}

function openAssets(uuid) {
  state.assets.uuid = String(uuid);
  fillAssetInstances();
  state.assets.uuid = String(uuid);
  switchTab("assets");
  loadAssets();
  $("viewAssets").scrollIntoView({ behavior: "smooth", block: "start" });
}

function wireAssets() {
  $("tabAssets").onclick = () => switchTab("assets");
  $("assetInstance").onchange = (event) => {
    state.assets.uuid = event.target.value;
    loadAssets();
  };
  $("assetKind").onchange = (event) => {
    state.assets.kind = event.target.value;
    $("assetStatus").textContent = "";
    renderAssets();
  };
  $("assetRefresh").onclick = () => loadAssets();
  $("lightboxClose").onclick = () => closeLightbox();
  $("lightbox").addEventListener("click", (event) => {
    if (event.target === $("lightbox")) closeLightbox();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && $("lightbox").classList.contains("show")) closeLightbox();
  });
}

// --- queues tab ---------------------------------------------------------------------------------------
const QUEUE_REFRESH_MS = 10000;

const queueElapsed = (startedAt) => {
  const start = Number(startedAt) || 0;
  return start ? clock((Date.now() - start) / 1000) : "00:00";
};

function stopQueueTimer() {
  clearInterval(state.queues.timer);
  state.queues.timer = null;
}

function startQueueTimer() {
  if (state.queues.timer || document.hidden) return;
  if ($("viewQueues").classList.contains("hidden")) return;
  state.queues.timer = setInterval(() => loadQueues(), QUEUE_REFRESH_MS);
}

async function loadQueues(uuid) {
  const queues = state.queues;
  if (!uuid && queues.loading) return;
  const seq = ++queues.seq;
  if (!uuid) {
    queues.loading = true;
    $("queueStatus").textContent = "loading…";
  }
  try {
    const data = await api(`/api/queues${uuid ? `?uuid=${encodeURIComponent(uuid)}` : ""}`);
    if (seq !== queues.seq) return;
    const boxes = data.boxes || [];
    if (uuid) {
      const index = queues.boxes.findIndex((box) => box.uuid === uuid);
      if (index >= 0) queues.boxes[index] = boxes[0];
      else queues.boxes = boxes;
    } else {
      queues.boxes = boxes;
    }
    queues.loaded = true;
    queues.error = "";
  } catch (error) {
    if (seq !== queues.seq) return;
    if (!queues.loaded) queues.boxes = [];
    queues.error = error.message;
  } finally {
    if (seq === queues.seq) {
      queues.loading = false;
      $("queueStatus").textContent = queues.error || "";
    }
  }
  if (seq !== queues.seq) return;
  renderQueues();
}

function renderQueues() {
  const queues = state.queues;
  const grid = $("queues");
  const depth = queues.boxes.reduce((sum, box) =>
    sum + Number((box.counts || {}).running || 0) + Number((box.counts || {}).pending || 0), 0);
  grid.textContent = "";
  $("queueCount").textContent = queues.loaded ? String(depth) : "";
  $("queueSummary").textContent = queues.boxes.length
    ? `${queues.boxes.length} instance${queues.boxes.length === 1 ? "" : "s"} · ${depth} queued` : "";

  if (queues.error && !queues.boxes.length) {
    grid.append(el("div", { className: "empty asset-error" }, [
      el("div", { textContent: queues.error }, []),
      el("button", { type: "button", textContent: "Retry", onclick: () => loadQueues() }, []),
    ]));
    return;
  }
  if (!queues.boxes.length) {
    grid.append(el("div", { className: "empty", textContent: queues.loaded ? "no running instances" : "loading…" }, []));
    return;
  }
  for (const box of queues.boxes) grid.append(queueCard(box));
}

function queueCard(box) {
  const counts = box.counts || {};
  const down = Boolean(box.error);
  const level = down ? "down" : Number(counts.running || 0) > 0 ? "busy" : "idle";
  const dot = { down: "down", busy: "ok", idle: "warn" }[level];
  const pillClass = { down: "down", busy: "busy", idle: "" }[level];
  const pillText = { down: "DOWN", busy: "PROCESSING", idle: "IDLE" }[level];

  const card = el("div", { className: `qcard ${dot}` }, [
    el("div", { className: "qhead" }, [
      el("span", { className: `qdot ${dot}` }, []),
      el("span", { className: "qname", textContent: boxTitle(box), title: box.uuid }, []),
      el("span", { className: "hhost", textContent: String(box.uuid || "").replace(/^pro-/, "") }, []),
      box.version ? el("span", { className: "hhost", textContent: `v${box.version}` }, []) : null,
      el("span", { className: `hpill ${pillClass}`.trim(), textContent: pillText }, []),
    ].filter(Boolean)),
    el("div", { className: "qcounts", textContent:
      `${counts.running || 0} running · ${counts.pending || 0} waiting · ${counts.finished || 0} done` }, []),
  ]);

  if (down) {
    card.append(el("div", { className: "empty asset-error" }, [
      el("div", { className: "hproblem", textContent: box.error, title: box.error }, []),
      el("button", { type: "button", textContent: "Retry", onclick: () => loadQueues(box.uuid) }, []),
    ]));
    return card;
  }
  card.append(queueRunning(box), queuePending(box), queueFinished(box));
  return card;
}

function queueModels(models) {
  const names = (models || []).filter(Boolean);
  if (!names.length) return null;
  return el("span", { className: "qmodels" }, names.slice(0, 4).map((name) =>
    el("span", { className: "chip", textContent: name, title: name }, [])));
}

function queueRunning(box) {
  const body = el("div", { className: "qsection" }, [
    el("div", { className: "qlabel", textContent: "Processing" }, []),
  ]);
  const running = box.running || [];
  if (!running.length) {
    body.append(el("div", { className: "qplain", textContent: "idle — nothing processing" }, []));
    return body;
  }
  for (const job of running) {
    const label = job.label || job.id || "job";
    const time = el("span", { className: "qtime", textContent: queueElapsed(job.started_at) }, []);
    time.dataset.queueStart = String(job.started_at || "0");
    body.append(el("div", { className: "qrun" }, [
      el("span", { className: "qrun-label", textContent: label, title: label }, []),
      time,
      queueModels(job.models),
      el("span", { className: "qplain", textContent: `${job.nodes || 0} nodes` }, []),
    ].filter(Boolean)));
  }
  return body;
}

function queuePending(box) {
  const body = el("div", { className: "qsection" }, [
    el("div", { className: "qlabel", textContent: "Waiting" }, []),
  ]);
  const pending = [...(box.pending || [])]
    .sort((a, b) => Number(a.number || 0) - Number(b.number || 0));
  if (!pending.length) {
    body.append(el("div", { className: "qplain", textContent: "queue empty" }, []));
    return body;
  }
  const list = el("div", { className: "qpending" }, []);
  for (const job of pending) {
    const label = job.label || job.id || "job";
    list.append(el("div", { className: "qrow" }, [
      el("b", { textContent: `#${job.number ?? "—"}` }, []),
      el("span", { textContent: label, title: label }, []),
      queueModels(job.models),
    ].filter(Boolean)));
  }
  body.append(list);
  return body;
}

function queueFinished(box) {
  const body = el("div", { className: "qsection" }, [
    el("div", { className: "qlabel", textContent: "Recently finished" }, []),
  ]);
  const finished = [...(box.finished || [])]
    .sort((a, b) => Number(b.ended_at || 0) - Number(a.ended_at || 0))
    .slice(0, 8);
  if (!finished.length) {
    body.append(el("div", { className: "qplain", textContent: "nothing finished yet" }, []));
    return body;
  }
  const strip = el("div", { className: "qfin" }, []);
  for (const job of finished) strip.append(queueTile(job, box.uuid));
  body.append(strip);
  return body;
}

function queueTile(job, uuid) {
  const file = (job.files || [])[0];
  if (!file) {
    return el("div", { className: "qrow" }, [
      el("b", { textContent: job.id || "job" }, []),
      el("span", { textContent: job.status || "" }, []),
    ].filter(Boolean));
  }
  const kind = ["image", "video"].includes(file.kind) ? file.kind : "file";
  const asset = {
    filename: file.filename, subfolder: file.subfolder || "", type: file.type || "output",
    kind, width: file.width, height: file.height, created_at: job.ended_at,
  };
  const media = el("div", { className: "qtile-media" }, []);
  if (kind === "image") {
    media.append(el("img", { src: assetFileUrl(asset, uuid), alt: file.filename, loading: "lazy" }, []));
  } else if (kind === "video") {
    media.append(el("span", { className: "qtile-play", textContent: "▶", title: file.filename }, []));
  } else {
    media.append(el("div", { className: "asset-missing", textContent: "file" }, []));
  }

  const ok = job.status === "success";
  const tile = el("div", { className: "qtile" }, [
    el("span", { className: `qtile-badge ${ok ? "success" : "error"}`, textContent: ok ? "success" : (job.status || "error") }, []),
    media,
    el("div", { className: "qtile-name", textContent: file.filename, title: assetPath(asset) }, []),
  ]);

  if (kind === "image") {
    tile.classList.add("clickable");
    tile.tabIndex = 0;
    tile.setAttribute("role", "button");
    tile.setAttribute("aria-label", `Open ${file.filename}`);
    const open = () => openLightbox(asset, tile, uuid);
    tile.addEventListener("click", open);
    tile.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        open();
      }
    });
  }
  return tile;
}

function wireQueues() {
  $("tabQueues").onclick = () => switchTab("queues");
  $("queueRefresh").onclick = () => loadQueues();
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopQueueTimer();
    else startQueueTimer();
  });
}

function wireBrowse() {
  $("tabDeploy").onclick = () => switchTab("deploy");
  $("tabBrowse").onclick = () => switchTab("browse");
  let timer = null;
  $("browseSearch").oninput = (event) => {
    clearTimeout(timer);
    const value = event.target.value.trim();
    timer = setTimeout(() => {
      state.browse.q = value;
      loadBrowse(true);
    }, 250);
  };
  $("browseSort").onchange = (event) => {
    state.browse.sort = event.target.value;
    loadBrowse(true);
  };
  $("browseMore").onclick = () => loadBrowse(false);
  $("detailClose").onclick = () => closeDetail();
  $("detailSelect").onclick = () => {
    if (state.detail && state.detail.app && state.detail.versions.length) {
      selectForDeploy(state.detail.app, state.detail.versions[0].id);
    }
  };
  $("detail").addEventListener("click", (event) => {
    if (event.target === $("detail")) closeDetail();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && $("detail").classList.contains("show")) closeDetail();
  });
}

function selectedDataCenters() {
  return [...document.querySelectorAll("#dc input:checked")].map((input) => input.value);
}

async function loadGpus() {
  const dcs = selectedDataCenters();
  const select = $("gpu");
  const query = (dcs.length ? dcs : ["westDC3"]).map((dc) => `dc=${encodeURIComponent(dc)}`).join("&");
  try {
    const data = await api(`/api/gpus?${query}`);
    const previous = select.value;
    select.textContent = "";
    for (const gpu of data.gpus) {
      const option = document.createElement("option");
      option.value = gpu.name;
      const price = gpu.list_price ? ` ¥${gpu.list_price.toFixed(2)}/h` : "";
      const perDc = Object.entries(gpu.idle_by_dc || {})
        .map(([dc, count]) => `${dc.replace(/DC.*/, "")} ${count}`).join(" · ");
      option.textContent = `${gpu.name}${gpu.card ? ` (${gpu.card})` : ""}${price} — ` +
        (gpu.available ? `${gpu.idle} idle` : "no stock, queue it") +
        (Object.keys(gpu.idle_by_dc || {}).length > 1 && perDc ? ` (${perDc})` : "");
      select.append(option);
    }
    const first = data.gpus.find((gpu) => gpu.name === previous)
      || data.gpus.find((gpu) => gpu.available)
      || data.gpus[0];
    if (first) select.value = first.name;
    if (!first) toast(`no idle GPU in ${dcs.join(" / ") || "westDC3"} right now`, true);
  } catch (error) {
    select.textContent = "";
    select.append(el("option", { value: "", textContent: "inventory unavailable" }));
    toast(`inventory: ${error.message}`, true);
  }
}

async function deploy(event) {
  event.preventDefault();
  const button = $("deployBtn");
  const body = {
    gpu: $("gpu").value,
    data_centers: selectedDataCenters(),
    name: $("name").value.trim(),
    disk_extra_gb: Number($("disk").value || 0),
    app_id: Number($("app").value),
    version_id: Number($("version").value),
    wait: $("waitStock").checked,
  };
  if (!body.gpu) { toast("pick a GPU slot", true); return; }
  if (!body.data_centers.length) { toast("check at least one data center", true); return; }
  if (!body.app_id) { toast("pick an application", true); return; }
  if (!body.version_id) { toast("pick an image version", true); return; }
  button.disabled = true;
  $("deployStatus").textContent = "submitting…";
  try {
    const result = await api("/api/instances", { method: "POST", body: JSON.stringify(body) });
    $("name").value = "";
    if (result.queued) {
      $("deployStatus").textContent = `${result.job_id} waiting for stock`;
      toast(`no stock now — ${result.job_id} will create as soon as a slot frees`);
    } else {
      state.pending.add(result.uuid);
      $("deployStatus").textContent = `${result.uuid} creating in ${result.data_center} (spec ${result.spec_id})`;
      toast(`${result.uuid} queued, polling until running`);
    }
    refresh();
    loadGpus();
  } catch (error) {
    $("deployStatus").textContent = "";
    toast(`create failed: ${error.message}`, true);
  } finally {
    button.disabled = false;
  }
}

async function power(item, action) {
  try {
    await api(`/api/instances/${encodeURIComponent(item.uuid)}/${encodeURIComponent(action)}`, { method: "POST" });
    toast(`${action.replace("_", " ")} sent to ${item.uuid}`);
    refresh();
  } catch (error) {
    toast(`${action} failed: ${error.message}`, true);
  }
}

async function release(item) {
  const frozen = item.status === "shutdown" ? "" : "\n\nThe box will be powered off first (billing runs until release).";
  if (!confirm(`Release ${item.uuid}?\nThis deletes the system disk and cannot be undone.${frozen}`)) return;
  try {
    await api(`/api/instances/${encodeURIComponent(item.uuid)}/release`, { method: "POST", body: JSON.stringify({ confirm: true }) });
    toast(`release started for ${item.uuid}`);
    refresh();
  } catch (error) {
    toast(`release failed: ${error.message}`, true);
  }
}

async function boot() {
  try {
    state.config = await api("/api/config");
  } catch (error) {
    showBanner(error.message);
    return;
  }
  if (!state.config.has_token) {
    showBanner(`No API token. Write the developer token to ~/.config/adl/token or start the server with ADL_TOKEN.`);
  }
  const dcBox = $("dc");
  for (const name of state.config.data_centers) {
    dcBox.append(el("label", {}, [
      el("input", { type: "checkbox", value: name, checked: true, onchange: loadGpus }),
      document.createTextNode(name),
    ]));
  }
  $("deploy").onsubmit = deploy;
  $("refreshGpu").onclick = loadGpus;
  wireBrowse();
  wireAssets();
  wireQueues();
  $("auto").onchange = (event) => {
    clearInterval(state.pollTimer);
    state.pollTimer = event.target.checked ? setInterval(refresh, 5000) : null;
  };
  await Promise.all([loadApps(), loadGpus(), refresh(), loadHealth()]);
  state.pollTimer = setInterval(refresh, 5000);
  setInterval(loadHealth, 5000);
  setInterval(tickHealth, 1000);
  setInterval(() => { if (document.getElementById("auto").checked) loadGpus(); }, 60000);
}

boot();
</script>
</body>
</html>
